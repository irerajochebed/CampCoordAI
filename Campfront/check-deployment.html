<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampCoordAI Deployment Checker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }
        
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .results {
            margin-top: 30px;
        }
        
        .test-item {
            padding: 16px;
            margin-bottom: 12px;
            border-radius: 10px;
            border-left: 4px solid #e0e0e0;
            background: #f9f9f9;
        }
        
        .test-item.loading {
            border-left-color: #667eea;
            animation: pulse 1.5s infinite;
        }
        
        .test-item.success {
            border-left-color: #10b981;
            background: #f0fdf4;
        }
        
        .test-item.error {
            border-left-color: #ef4444;
            background: #fef2f2;
        }
        
        .test-name {
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 14px;
        }
        
        .test-message {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }
        
        .test-item.error .test-message {
            color: #dc2626;
        }
        
        .test-item.success .test-message {
            color: #059669;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .status-icon {
            display: inline-block;
            margin-right: 8px;
        }
        
        pre {
            background: #1f2937;
            color: #f3f4f6;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 12px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 CampCoordAI Deployment Checker</h1>
        <p class="subtitle">Test your backend and frontend connectivity</p>
        
        <div class="input-group">
            <label for="backendUrl">Backend URL</label>
            <input 
                type="url" 
                id="backendUrl" 
                placeholder="https://your-backend.onrender.com/api"
                value="http://localhost:8080/api"
            >
        </div>
        
        <button onclick="runTests()" id="testBtn">Run Diagnostic Tests</button>
        
        <div class="results" id="results"></div>
    </div>
    
    <script>
        async function runTests() {
            const backendUrl = document.getElementById('backendUrl').value.trim();
            const resultsDiv = document.getElementById('results');
            const testBtn = document.getElementById('testBtn');
            
            if (!backendUrl) {
                alert('Please enter your backend URL');
                return;
            }
            
            // Disable button
            testBtn.disabled = true;
            testBtn.textContent = 'Running Tests...';
            
            // Clear previous results
            resultsDiv.innerHTML = '';
            
            const tests = [
                {
                    name: 'Backend Reachability',
                    test: () => testBackendReachability(backendUrl)
                },
                {
                    name: 'CORS Configuration',
                    test: () => testCORS(backendUrl)
                },
                {
                    name: 'Login Endpoint',
                    test: () => testLoginEndpoint(backendUrl)
                },
                {
                    name: 'Organization Units API',
                    test: () => testOrgUnitsAPI(backendUrl)
                },
                {
                    name: 'Frontend Environment',
                    test: () => testFrontendEnv()
                }
            ];
            
            for (const test of tests) {
                const testElement = createTestElement(test.name);
                resultsDiv.appendChild(testElement);
                
                try {
                    const result = await test.test();
                    updateTestElement(testElement, result);
                } catch (error) {
                    updateTestElement(testElement, {
                        success: false,
                        message: error.message
                    });
                }
            }
            
            // Re-enable button
            testBtn.disabled = false;
            testBtn.textContent = 'Run Tests Again';
        }
        
        function createTestElement(name) {
            const div = document.createElement('div');
            div.className = 'test-item loading';
            div.innerHTML = `
                <div class="test-name">
                    <span class="status-icon">⏳</span>
                    ${name}
                </div>
                <div class="test-message">Running test...</div>
            `;
            return div;
        }
        
        function updateTestElement(element, result) {
            element.className = `test-item ${result.success ? 'success' : 'error'}`;
            const icon = result.success ? '✅' : '❌';
            element.querySelector('.test-name .status-icon').textContent = icon;
            element.querySelector('.test-message').innerHTML = result.message;
        }
        
        async function testBackendReachability(backendUrl) {
            try {
                const response = await fetch(backendUrl.replace('/api', '') + '/api/auth/login', {
                    method: 'GET',
                    mode: 'cors'
                });
                
                // Any response means backend is reachable
                return {
                    success: true,
                    message: `Backend is reachable! Status: ${response.status}`
                };
            } catch (error) {
                return {
                    success: false,
                    message: `Cannot reach backend: ${error.message}<br><br>` +
                            `<strong>Possible causes:</strong><br>` +
                            `• Backend is not deployed or crashed<br>` +
                            `• Wrong URL<br>` +
                            `• Network issue`
                };
            }
        }
        
        async function testCORS(backendUrl) {
            try {
                const response = await fetch(backendUrl + '/auth/login', {
                    method: 'OPTIONS',
                    headers: {
                        'Origin': window.location.origin,
                        'Access-Control-Request-Method': 'POST'
                    }
                });
                
                const allowOrigin = response.headers.get('Access-Control-Allow-Origin');
                
                if (allowOrigin && (allowOrigin === '*' || allowOrigin === window.location.origin)) {
                    return {
                        success: true,
                        message: `CORS is configured correctly!<br>` +
                                `Allowed Origin: ${allowOrigin}`
                    };
                } else {
                    return {
                        success: false,
                        message: `CORS may not be configured for this origin.<br>` +
                                `Current origin: ${window.location.origin}<br>` +
                                `Allowed: ${allowOrigin || 'Not set'}<br><br>` +
                                `<strong>Fix:</strong> Add your domain to CORS_ALLOWED_ORIGINS in backend`
                    };
                }
            } catch (error) {
                return {
                    success: false,
                    message: `CORS preflight failed: ${error.message}<br><br>` +
                            `This usually means CORS is not configured properly on the backend.`
                };
            }
        }
        
        async function testLoginEndpoint(backendUrl) {
            try {
                const response = await fetch(backendUrl + '/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'test@test.com',
                        password: 'wrongpassword'
                    })
                });
                
                // 401 or 400 is expected for wrong credentials
                if (response.status === 401 || response.status === 400) {
                    return {
                        success: true,
                        message: `Login endpoint is working! Status: ${response.status}<br>` +
                                `(401/400 expected for invalid credentials)`
                    };
                } else if (response.status === 404) {
                    return {
                        success: false,
                        message: `Login endpoint not found (404).<br>` +
                                `Check if backend is fully deployed.`
                    };
                } else {
                    const data = await response.json().catch(() => ({}));
                    return {
                        success: true,
                        message: `Login endpoint responded with status ${response.status}`
                    };
                }
            } catch (error) {
                return {
                    success: false,
                    message: `Cannot test login endpoint: ${error.message}`
                };
            }
        }
        
        async function testOrgUnitsAPI(backendUrl) {
            try {
                const response = await fetch(backendUrl.replace('/api', '') + '/api/v1/org-units/fields', {
                    method: 'GET'
                });
                
                if (response.ok) {
                    const data = await response.json();
                    return {
                        success: true,
                        message: `Organization units API is working!<br>` +
                                `Found ${Array.isArray(data) ? data.length : 'some'} organizations`
                    };
                } else {
                    return {
                        success: false,
                        message: `Organization units API returned ${response.status}<br>` +
                                `This endpoint should be publicly accessible.`
                    };
                }
            } catch (error) {
                return {
                    success: false,
                    message: `Cannot access organization units: ${error.message}`
                };
            }
        }
        
        function testFrontendEnv() {
            const apiUrl = import.meta.env?.VITE_API_BASE_URL;
            const nodeEnv = import.meta.env?.VITE_NODE_ENV || import.meta.env?.MODE;
            
            if (!apiUrl) {
                return {
                    success: false,
                    message: `VITE_API_BASE_URL is not set!<br><br>` +
                            `<strong>Fix:</strong><br>` +
                            `1. Go to Vercel Dashboard<br>` +
                            `2. Settings → Environment Variables<br>` +
                            `3. Add: VITE_API_BASE_URL = https://your-backend.onrender.com/api<br>` +
                            `4. Redeploy`
                };
            }
            
            if (apiUrl.includes('localhost')) {
                return {
                    success: false,
                    message: `VITE_API_BASE_URL points to localhost!<br>` +
                            `Current: ${apiUrl}<br><br>` +
                            `<strong>Fix:</strong> Update to your production backend URL`
                };
            }
            
            return {
                success: true,
                message: `Environment variables are configured correctly!<br>` +
                        `API URL: ${apiUrl}<br>` +
                        `Environment: ${nodeEnv || 'Not set'}`
            };
        }
    </script>
</body>
</html>
