spring:
  application:
    name: CampCoordAI
  main:
    allow-circular-references: true

  # Database Configuration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/camp}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  # Database Initialization via data.sql
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
      continue-on-error: true

  # JPA & Hibernate Configuration
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
        validator:
          apply_to_ddl: false

  # File Upload Configuration
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  # Jackson Configuration
  jackson:
    time-zone: Africa/Kigali

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:CampCoordAI-Rwanda-Union-Mission-Secret-Key-2026-Very-Secure-Random-String-For-JWT}
  expiration: ${JWT_EXPIRATION:86400000}

# Logging Configuration
logging:
  level:
    root: INFO
    com.example.Camp: DEBUG
    org.springframework.web: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
